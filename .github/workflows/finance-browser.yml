name: Voltara V2 navegador
on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/finance-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  finance-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Auditoria de dependências
        run: bun audit
      - name: Instalar Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/voltara-browser" --no-audit --no-fund playwright@1.57.0
          node "$RUNNER_TEMP/voltara-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Testar finanças, OCR e Dexie sem acesso à produção
        env:
          VOLTARA_PLAYWRIGHT_ROOT: ${{ runner.temp }}/voltara-browser
        run: |
          bun run dev --host 127.0.0.1 --port 4173 --strictPort > /tmp/voltara-dev.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true; cat /tmp/voltara-dev.log' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/ >/dev/null
          node scripts/finance-browser-audit.cjs
